name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

  deptry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run deptry src/

  # Async-first gate: fail if any blocking file/subprocess/sleep/network call runs
  # directly inside an `async def` (must be offloaded via asyncio.to_thread /
  # run_in_executor). Catches the event-loop-blocking bug class before review.
  async-blocking-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python scripts/check_async_blocking.py

  world-model-retrieval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench
      - run: uv run pytest benchmarks/test_world_model_retrieval_bench.py -v

  # Enforces the #734 AgentSwarm acceptance targets: market routing must beat a
  # hardcoded round-robin AgentFederation on quality by >=15% and cost >=25% less
  # than always-routing-to-best-model, on a deterministic 100-task benchmark.
  agent-swarm-market-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench
      - run: uv run pytest benchmarks/test_agent_swarm_bench.py -v

  # Enforces the #732 self-evolving acceptance targets: a SelfImprovingAgent must
  # lift its own held-out accuracy from a fallible baseline (<=50%) to >=90% over 5
  # evolution cycles, never regressing, with every decoy candidate blocked by the gate.
  self-evolving-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench
      - run: uv run pytest benchmarks/test_self_evolving_bench.py -v

  # Neuro-symbolic acceptance gate (#733): routing arithmetic through the symbolic
  # solver beats answering directly by >=25pp. Needs the `symbolic` extra (sympy).
  neuro-symbolic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench --extra symbolic
      - run: uv run pytest benchmarks/test_neuro_symbolic_bench.py -v

  # Harness-correctness check for the edge local-vs-cloud benchmark (#736). Runs
  # against stub LLMs -- no GGUF file or ANTHROPIC_API_KEY in CI -- so it can
  # only assert the graders and runner are right, not real model quality.
  edge-benchmark-harness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench
      - run: uv run pytest benchmarks/test_edge_local_vs_cloud_bench.py -v

  # Real-backend tests via testcontainers (Neo4j/Memgraph, Kuzu, property graph).
  # ubuntu-latest ships a running Docker daemon, so these execute for real here
  # instead of skipping. Kept as a separate job so the fast `test` job stays lean.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group integration
      - run: uv run pytest tests/retrieval/test_world_model.py tests/retrieval/test_okf_graph.py tests/retrieval/test_property_graph.py tests/retrieval/test_pgvector_integration.py tests/retrieval/test_redis_vector_integration.py tests/retrieval/test_elasticsearch_vector_integration.py tests/retrieval/test_mongodb_atlas_integration.py tests/retrieval/test_qdrant_integration.py tests/retrieval/test_weaviate_integration.py tests/retrieval/test_milvus_integration.py tests/retrieval/test_cassandra_vector_integration.py tests/retrieval/test_clickhouse_vector_integration.py tests/retrieval/test_opensearch_vector_integration.py tests/memory/test_postgres_memory_backend_integration.py tests/memory/test_redis_memory_backend_integration.py tests/graph/test_checkpointers_integration.py tests/loaders/test_s3_loader_integration.py tests/loaders/test_sql_loader_integration.py tests/loaders/test_mongodb_loader_integration.py tests/loaders/test_redis_loader_integration.py tests/loaders/test_elasticsearch_loader_integration.py tests/loaders/test_dynamodb_loader_integration.py tests/loaders/test_azure_blob_loader_integration.py -v

  # Real Ollama local inference (heavy: ~1GB image + model pull + CPU inference),
  # isolated in its own job so it can't destabilise the main integration suite.
  ollama-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group integration
      - run: uv run pytest tests/llm/test_ollama_integration.py -v
