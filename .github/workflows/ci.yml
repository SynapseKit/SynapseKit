name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest tests/ -v

  deptry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run deptry src/

  world-model-retrieval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group bench
      - run: uv run pytest benchmarks/test_world_model_retrieval_bench.py -v

  # Real-backend tests via testcontainers (Neo4j/Memgraph, Kuzu, property graph).
  # ubuntu-latest ships a running Docker daemon, so these execute for real here
  # instead of skipping. Kept as a separate job so the fast `test` job stays lean.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group integration
      - run: uv run pytest tests/retrieval/test_world_model.py tests/retrieval/test_property_graph.py tests/retrieval/test_pgvector_integration.py tests/retrieval/test_redis_vector_integration.py tests/retrieval/test_elasticsearch_vector_integration.py tests/retrieval/test_mongodb_atlas_integration.py tests/retrieval/test_qdrant_integration.py tests/retrieval/test_weaviate_integration.py tests/retrieval/test_milvus_integration.py tests/retrieval/test_cassandra_vector_integration.py -v
