name: Update comparison matrix (quarterly)

on:
  schedule:
    - cron: "0 0 1 */3 *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update comparison matrix
        run: python scripts/update_comparison_matrix.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update comparison matrix"
          title: "chore: quarterly comparison matrix refresh"
          body: "Automated quarterly refresh of comparison matrix dates and activity."
          branch: "automation/comparison-matrix-refresh"
          delete-branch: true
