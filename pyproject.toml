[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapsekit"
version = "2.0.1"
description = "Async-native Python framework for building LLM applications — RAG pipelines, tool-using agents, and graph workflows. Streaming-first, transparent API, 2 hard deps."
authors = [{ name = "Amit.N", email = "research.amit.n@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["rag", "llm", "ai", "async", "streaming", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    # Pin to patched versions for high-severity advisories
    "pillow>=13.0.0",
    "pyasn1>=0.6.5",
    # Ed25519 is the default (and only always-available) audit-bundle
    # signing algorithm — it must work out of the box, not only via an
    # opt-in extra. Floor raised to 50.0.0 for PYSEC-2026-3552.
    "cryptography>=50.0.0",
]

[project.urls]
Homepage = "https://github.com/SynapseKit/SynapseKit"
Repository = "https://github.com/SynapseKit/SynapseKit"
Documentation = "https://synapsekit.github.io/synapsekit-docs/"
Discord = "https://discord.gg/PSuAXHRywJ"

[project.scripts]
synapsekit = "synapsekit.cli.main:main"

synshell = "synapsekit.cli.shell:main"

