# All open advisories require running the chromadb *server* with auth enabled:
#   - GHSA-36p7-vc44-83pf / CVE-2026-45833 (critical, code injection via
#     trust_remote_code on UPDATE_COLLECTION) — server endpoint only
#   - GHSA-2wm9-hf6c-p5cr (cross-tenant read/write) — server multi-tenancy
#   - GHSA-xph7-9rjv-w5fr (SimpleRBACAuthorizationProvider scoping) — server RBAC
#   - CVE-2026-45829 (>=1.0.0) — server, also why we cap below 1.0.0
# SynapseKit uses chromadb embedded-only (PersistentClient/EphemeralClient in
