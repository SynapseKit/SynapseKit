# Real-backend integration tests. These deps + a running Docker daemon let the
# testcontainers-based tests (Neo4j/Memgraph, Kuzu, property graph) execute for
# real instead of skipping via importorskip. Installed by the CI `integration`
# job; run locally with `uv sync --group dev --group integration`.
integration = [
    "testcontainers>=4.0",
    "neo4j>=5.0",
    "networkx>=3.0",
    "kuzu>=0.8",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "redis>=5.0",
    "elasticsearch>=8.0,<9",
    "pymongo>=4.18.2",
    "google-cloud-firestore>=2.13",
    # azure.cosmos.aio.CosmosClient (used by CosmosDBMemoryBackend/CosmosDBCheckpointer
    # and by the cosmos_config test fixture's readiness probe) requires an async
    # HTTP transport; aiohttp is azure-core's default and was previously missing
    # from this group, masked because the Cosmos test always skipped before ever
    # reaching a real connection attempt.
    "aiohttp>=3.14.4",
    "azure-cosmos>=4.0",
    "qdrant-client>=1.9",
    "weaviate-client>=4.0",
    "pymilvus>=2.4",
    "milvus-lite>=2.4",
    "cassandra-driver>=3.28",
    "clickhouse-connect>=0.7",
    "opensearch-py>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.26",
    "sqlalchemy>=2.0",
    # Azurite (the Azure Storage emulator) lags the azure-storage-blob default
    # API version; pin to a range Azurite accepts so the loader integration test runs.
    "azure-storage-blob>=12.0,<12.20",
    "ollama>=0.3",
    "kafka-python>=2.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools>=84.1.0"]

# Security floors for transitive dependencies. These keep our resolved
# lock / CI / Docker images off vulnerable versions even when a direct
# dependency's own constraints would otherwise permit them.
#   httplib2  <0.32.0  — pulled via google-api-python-client (gdrive/gsheets)
#   setuptools floor >=84.1.0 — build-time transitive
#   h2        <=4.4.0  — pulled via httpx[http2] (GHSA-6hr6-w5qg-qmwg, request smuggling)
constraint-dependencies = [
    "httplib2>=0.32.0",
    "setuptools>=84.1.0",
    "h2>=4.4.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.13",
    "fsspec>=2026.6.0",
    "multidict>=6.9.1",
    "filelock>=4.2.1",
    "certifi>=2026.10.19",
    "dnspython>=2.9.0",
    "aiohttp>=3.14.4",
    "authlib>=1.9.1",
    "joserfc>=1.7.6",
    "oauthlib>=4.0.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-asgi>=0.66b2",
    "opentelemetry-semantic-conventions>=0.66b2",
    "opentelemetry-util-http>=0.66b2",
    # mcp is a direct extra dep floored at >=1.28.1; GHSA affects 2.0.0<=v<2.2.0.
    # Constrain the resolved version here rather than raising the published floor
    # to 2.x, which would force a breaking major bump on downstream 1.x users.
    "mcp>=2.2.0",
    "anyio>=4.14.2",
    "soupsieve>=2.9.0",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapsekit"]

# Rust extension (optional — built separately with maturin)
# To build: cd src/synapsekit/_rust && maturin develop
# The pure-Python wheel uses hatchling above; the Rust-accelerated wheel
# is published separately using maturin as the build backend.
[tool.maturin]
module-name = "synapsekit._rust_core"
manifest-path = "src/synapsekit/_rust/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services or Docker",
]
# Windows asyncio transport cleanup warnings are harmless GC artifacts
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF022", "UP047", "RUF012", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N817", "B017"]
"src/synapsekit/symbolic/types.py" = ["N818"]
"tests/loaders/test_dropbox_loader.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["synapsekit"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["synapsekit"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

