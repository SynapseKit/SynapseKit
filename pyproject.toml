# Real-backend integration tests. These deps + a running Docker daemon let the
# testcontainers-based tests (Neo4j/Memgraph, Kuzu, property graph) execute for
# real instead of skipping via importorskip. Installed by the CI `integration`
# job; run locally with `uv sync --group dev --group integration`.
integration = [
    "testcontainers>=4.0",
    "neo4j>=5.0",
    "networkx>=3.0",
    "kuzu>=0.8",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "redis>=5.0",
    "elasticsearch>=8.0,<9",
    "pymongo>=4.0",
    "qdrant-client>=1.9",
    "weaviate-client>=4.0",
    "pymilvus>=2.4",
    "milvus-lite>=2.4",
    "cassandra-driver>=3.28",
    "clickhouse-connect>=0.7",
    "opensearch-py>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.26",
    "sqlalchemy>=2.0",
    # Azurite (the Azure Storage emulator) lags the azure-storage-blob default
    # API version; pin to a range Azurite accepts so the loader integration test runs.
    "azure-storage-blob>=12.0,<12.20",
    "ollama>=0.3",
]

[tool.uv]
# Security floors for transitive dependencies. These keep our resolved
# lock / CI / Docker images off vulnerable versions even when a direct
# dependency's own constraints would otherwise permit them.
#   httplib2  <0.32.0  — pulled via google-api-python-client (gdrive/gsheets)
#   setuptools <83.0.0 — build-time transitive
#   h2        <=4.4.0  — pulled via httpx[http2] (GHSA-6hr6-w5qg-qmwg, request smuggling)
constraint-dependencies = [
    "httplib2>=0.32.0",
    "setuptools>=83.0.0",
    "h2>=4.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapsekit"]

# Rust extension (optional — built separately with maturin)
# To build: cd src/synapsekit/_rust && maturin develop
# The pure-Python wheel uses hatchling above; the Rust-accelerated wheel
# is published separately using maturin as the build backend.
[tool.maturin]
module-name = "synapsekit._rust_core"
manifest-path = "src/synapsekit/_rust/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Windows asyncio transport cleanup warnings are harmless GC artifacts
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF022", "UP047", "RUF012", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N817", "B017"]
"src/synapsekit/symbolic/types.py" = ["N818"]
"tests/loaders/test_dropbox_loader.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["synapsekit"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["synapsekit"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

